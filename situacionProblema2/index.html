   '<div><div class="eyeline">Seguimos from desde el final B hacia el origen</div><div class="hk-strip">'+letters.map((l,i)=>(i?'<i>←</i>':'')+'<span>'+l+'</span>').join('')+'</div><p class="caption">La flecha indica quién llegó antes. '+letter(previous)+' fue anterior a '+letter(reconstructionNode)+'.</p></div>',
   L('Consulta del anterior',call('from['+reconstructionMask+']['+reconstructionNode+'] = '+previous))+
   para('Guardamos '+letter(previous)+' y seguimos consultando sus anteriores, quitando la última colonia del conjunto.')+
   code('prev = from[mask][cur];\nmask ^= (1 << cur);\ncur = prev;'))});
 reconstructionMask^=1<<reconstructionNode;
 reconstructionNode=previous;
}

function dpTable(){
 const n=D.length,full=1<<n,count=m=>m.toString(2).split('1').length-1,masks=[];
 for(let m=1;m<full;m++)if(m&1)masks.push(m);
 masks.sort((a,b)=>count(a)-count(b)||a-b);
 const route=new Set();let m=full-1,c=exact.best.last;while(c!==-1){route.add(m+'_'+c);const p=exact.from[m][c];m^=1<<c;c=p;}
 let html='<table class="dp-table"><thead><tr><th>mask</th><th>Visitadas</th>'+D.map((_,i)=>'<th>Termina en '+letter(i)+'</th>').join('')+'</tr></thead><tbody>',last=0;
 for(const mask of masks){
   html+='<tr class="'+(last&&count(mask)!==last?'layer':'')+'"><td class="mask"><b>'+mask.toString(2).padStart(n,'0')+'</b> · '+mask+'</td><td class="set">{'+D.map((_,i)=>i).filter(i=>mask&(1<<i)).map(letter).join(', ')+'}</td>';
   last=count(mask);
   for(let i=0;i<n;i++){const v=exact.dp[mask][i];
     if(!Number.isFinite(v)){html+='<td class="off">·</td>';continue;}
     const from=exact.from[mask][i];
     html+='<td class="'+(route.has(mask+'_'+i)?'route':'')+'">'+v+'<small>'+(from===-1?'inicio':'desde '+letter(from))+'</small></td>';}
   html+='</tr>';
 }
 return html+'</tbody></table>';
}

 const s=deck[page],f=s.frames[build],el=document.getElementById('presentation');

 document.getElementById('chapter-name').textContent=f.label||s.chapter;

function move(delta){
 if(delta>0){if(build<deck[page].frames.length-1)build++;else if(page<deck.length-1){page++;build=0;}else return;}
 else{if(build>0)build--;else if(page>0){page--;build=deck[page].frames.length-1;}else return;}
 render();
}
